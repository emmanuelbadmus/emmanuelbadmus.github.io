<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grid Explorer</title>
<meta name="description" content="Take lines out of a transmission grid, or connect a data center or a power plant, and watch the power reroute. AC power flow solved in the browser.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ---------- tokens ---------- */
:root {
  color-scheme: light;
  --font: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;

  --bg: #f4f5f7;
  --bg-glow: #ffffff;
  --surface: rgba(255, 255, 255, 0.88);
  --surface-solid: #ffffff;
  --surface-2: #f1f3f6;
  --border: rgba(15, 23, 42, 0.09);
  --border-strong: rgba(15, 23, 42, 0.16);
  --shadow: 0 1px 2px rgba(15, 23, 42, 0.06), 0 8px 24px rgba(15, 23, 42, 0.08);
  --text: #0f172a;
  --text-2: #475467;
  --text-3: #646e80;
  --accent: #2a78d6;
  --accent-soft: rgba(42, 120, 214, 0.10);
  --accent-strong: #236bc4;
  --accent-text: #2163b8;

  /* map */
  --bus: #3b4556;
  --bus-ring: #f4f5f7;
  --gen: #1baf7a;
  --slack: #0f172a;
  --fuel-nuclear: #6250d6;
  --fuel-coal: #6f655c;
  --fuel-gas: #eb6834;
  --fuel-hydro: #1baf7a;
  --fuel-solar: #eda100;
  --fuel-wind: #008300;
  --fuel-oil: #c2457a;
  --fuel-other: #8a94a6;
  --dead: #a3acb8;
  --removed: #d03b3b;
  --label: #334155;
  --halo: rgba(42, 120, 214, 0.28);
  --xfmr: #94a0b2;
  --dot: rgba(255, 255, 255, 0.95);
  --seq-0: #7896c0;
  --seq-1: #3f86dc;
  --seq-2: #184f95;
  /* room for new load: none worth having (gray), then one hue, light to deep */
  --room-0: #b4bcc7;
  --room-1: #a6dcc9;
  --room-2: #6cc3a5;
  --room-3: #3aa081;
  --room-4: #1c7a5f;
  --room-5: #0a4f3d;
  --div-neg: #2a78d6;
  --div-mid: #848e9d;
  --div-pos: #e34948;
  --muted-line: #8c96a4;
  --bus-mid: #959fad;
  --load: #7b8494;
  --map-land: #f1f2f4;
  --map-water: #d9e0e7;
  --map-green: #e8ebe7;
  --map-border: #aab2bd;
  --map-road: 0.4;

  /* status: fixed */
  --good: #0ca30c;
  --warn: #e39a00;
  --serious: #ec835a;
  --crit: #d03b3b;
  /* the same states as text, dark enough to read on the panel */
  --crit-text: #b42f2f;
  --warn-text: #8a5a00;
  --good-text: #0b740b;
  --pos-text: #c0392f;
  --neg-text: #2163b8;
  --badge: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0a0e15;
    --bg-glow: #121a28;
    --surface: rgba(16, 21, 31, 0.86);
    --surface-solid: #121722;

    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 12px 32px rgba(0, 0, 0, 0.45);
    --text: #e8ebf1;
    --text-2: #a7afbd;
    --text-3: #8590a2;
    --accent: #5598e7;
    --accent-soft: rgba(85, 152, 231, 0.14);
    --accent-strong: #2a6fcb;
    --accent-text: #5598e7;
    --crit-text: #f47067;
    --warn-text: #f5b73b;
    --good-text: #4cc44c;
    --pos-text: #ef6461;
    --neg-text: #4a90e8;
    --badge: #c43c35;
    --bus: #c8cfdb;
    --bus-ring: #0a0e15;
    --gen: #2bc48d;
    --slack: #e8ebf1;
    --fuel-nuclear: #9085e9;
    --fuel-coal: #9a8f85;
    --fuel-gas: #d95926;
    --fuel-hydro: #199e70;
    --fuel-solar: #c98500;
    --fuel-wind: #2e9d2e;
    --fuel-oil: #d55181;
    --fuel-other: #6c7586;
    --dead: #4a5263;
    --removed: #e5534b;
    --label: #c3cad6;
    --halo: rgba(85, 152, 231, 0.35);
    --xfmr: #5d6779;
    --dot: rgba(255, 255, 255, 0.85);
    --seq-0: #3f67a0;
    --seq-1: #2f7ad6;
    --seq-2: #a9cdf6;
    --room-0: #4a5263;
    --room-1: #24584a;
    --room-2: #2c7c66;
    --room-3: #3aa585;
    --room-4: #62c9a6;
    --room-5: #aaf0d6;
    --div-neg: #4a90e8;
    --div-mid: #5f6a7e;
    --div-pos: #ef6461;
    --muted-line: #566176;
    --bus-mid: #5a6272;
    --load: #8d96a7;
    --warn: #fab219;
    --map-land: #0b0f16;
    --map-water: #131c2a;
    --map-green: #0d131b;
    --map-border: #343d4c;
    --map-road: 0.4;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0a0e15;
  --bg-glow: #121a28;
  --surface: rgba(16, 21, 31, 0.86);
  --surface-solid: #121722;

  --room-1: #24584a;
  --room-2: #2c7c66;

  --map-water: #131c2a;
  --map-green: #0d131b;
  --map-border: #343d4c;
  --map-road: 0.4;
}

/* ---------- base ---------- */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 13px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
.kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-3); }

/* ---------- top bar ---------- */
.top {
  position: relative;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 14px;
  height: 56px;
  padding: 0 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface-solid);
  flex-shrink: 0;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 26px; height: 26px; flex-shrink: 0; }
.brand-name { font-weight: 650; font-size: 15px; letter-spacing: -0.01em; white-space: nowrap; }
.spacer { flex: 1; }
.seg {
  display: inline-flex;
  padding: 3px;
  gap: 2px;
  border-radius: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
}
.seg button {
  border: 0;
  background: transparent;
  padding: 5px 11px;
  border-radius: 7px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  white-space: nowrap;
  transition: background .15s, color .15s;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] {
  background: var(--surface-solid);
  color: var(--text);
  box-shadow: 0 1px 2px rgba(0,0,0,.12), 0 0 0 1px var(--border);
}
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: #273042; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: #273042; } }
.seg button:disabled { opacity: .4; cursor: default; }
.seg button:focus-visible, .icon-btn:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.net-select {
  display: none;
  height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border-strong);
  background: var(--surface-2);
  color: var(--text);
  padding: 0 8px;
  font: 500 13px var(--font);
}
.icon-btn {
  width: 34px; height: 34px;
  display: inline-grid; place-items: center;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-2);
  cursor: pointer;
  flex-shrink: 0;
}
.icon-btn:hover { color: var(--text); border-color: var(--border-strong); }
.icon-btn svg { width: 17px; height: 17px; }
.sun { display: none; }
:root[data-theme="dark"] .sun { display: block; }
:root[data-theme="dark"] .moon { display: none; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .sun { display: block; }
  :root:not([data-theme="light"]) .moon { display: none; }
}

/* ---------- stage ---------- */
.stage {
  position: relative;
  flex: 1;
  min-height: 0;
  background: radial-gradient(1200px 800px at 38% 45%, var(--bg-glow), var(--bg) 70%);
  overflow: hidden;
}
#basemap { position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .5s; }
#basemap.on { opacity: 1; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#map.dragging { cursor: grabbing; }
#map.pointing { cursor: pointer; }

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: var(--shadow);
  backdrop-filter: blur(14px) saturate(1.2);
  -webkit-backdrop-filter: blur(14px) saturate(1.2);
}

/* map controls */
.map-ctrl {
  position: absolute; left: 16px; top: 16px; z-index: 10;
  display: flex; flex-direction: column; gap: 6px;
}
.map-ctrl .icon-btn { background: var(--surface); backdrop-filter: blur(10px); box-shadow: var(--shadow); }

.icon-btn[aria-pressed="true"] { color: var(--accent); }
.icon-btn:disabled { opacity: .45; cursor: default; }
/* scale bar + map credits, at the bottom right of the free map area */
.map-foot { position: absolute; z-index: 9; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; pointer-events: none; }
.scale { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-2); }
.scale-bar { height: 6px; border: 1.5px solid var(--text-2); border-top: 0; border-radius: 0 0 2px 2px; }
.scale span { text-shadow: 0 0 3px var(--bg), 0 0 3px var(--bg); }
.attrib { display: flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--text-2); pointer-events: auto; background: color-mix(in srgb, var(--bg) 78%, transparent); padding: 1px 6px; border-radius: 6px; white-space: nowrap; }
.attrib a { color: inherit; }
.attrib[hidden] { display: none; }
.attrib-i { display: none; width: 20px; height: 20px; padding: 0; border-radius: 50%; border: 1px solid var(--border-strong); background: var(--surface-solid); color: var(--text-2); font: 600 11px/1 var(--font); cursor: pointer; place-items: center; }
.attrib.compact { padding: 0; background: transparent; }
.attrib.compact .attrib-i { display: inline-grid; }
.attrib.compact .attrib-text { display: none; }
.attrib.compact.open { padding: 2px 2px 2px 8px; background: var(--surface-solid); box-shadow: var(--shadow); border-radius: 12px; }
.attrib.compact.open .attrib-text { display: inline; }

/* legend */
.legend {
  position: absolute; left: 16px; bottom: 16px; z-index: 10;
  width: 268px; padding: 12px 14px 12px;
  max-height: calc(100% - 16px - var(--ctrl-h) - 12px - 16px); overflow-y: auto; overscroll-behavior: contain;
}
.legend h4 { margin: 0 0 8px; padding-right: 22px; font-size: 12px; font-weight: 600; color: var(--text); }
.legend .lg-short { display: none; }
.legend.collapsed .lg-short { display: inline; }
.legend.collapsed .lg-full { display: none; }
.legend .ramp { height: 8px; border-radius: 4px; margin: 2px 0 4px; }
.legend .ramp-labels { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; color: var(--text-3); white-space: nowrap; }
.legend .rows { display: grid; gap: 5px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); }
.legend .row { display: flex; align-items: center; gap: 9px; font-size: 12px; color: var(--text-2); }
.legend .sw { width: 22px; height: 12px; flex-shrink: 0; display: grid; place-items: center; }
.legend .sw svg { width: 22px; height: 12px; overflow: visible; }
.legend .note { margin-top: 8px; font-size: 11.5px; color: var(--text-3); }
.legend .fuel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 8px; margin: -1px 0 2px; }
.legend .row.lg-sub { color: var(--text); margin-top: 4px; }
.legend-toggle { position: absolute; top: 8px; right: 8px; width: 24px; height: 24px; border-radius: 6px; border: 0; background: transparent; color: var(--text-3); cursor: pointer; }
@media (hover: hover) { .legend-toggle:hover { color: var(--text); background: var(--surface-2); } }
.legend-toggle svg { transition: transform .15s; }
.legend.collapsed .legend-toggle svg { transform: rotate(180deg); }   /* at the bottom it opens upward */
.legend.collapsed .legend-body { display: none; }
.legend.collapsed { width: auto; padding: 8px 36px 8px 12px; overflow: visible; }
.legend.collapsed h4 { margin: 0; }

/* loading */
.busy { position: absolute; inset: 0; z-index: 25; display: grid; place-items: center; pointer-events: none; opacity: 0; transition: opacity .15s; }
.busy.on { opacity: 1; pointer-events: auto; background: color-mix(in srgb, var(--bg) 35%, transparent); }
.busy-card { display: flex; align-items: center; gap: 12px; padding: 14px 18px; font-weight: 500; max-width: calc(100% - 32px); }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid var(--border-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; flex-shrink: 0; }
@keyframes spin { to { transform: rotate(360deg); } }
/* pill + toast */
.pill {
  position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 12;
  padding: 7px 14px; border-radius: 999px; font-size: 12.5px; font-weight: 500; text-align: center;
  background: var(--text); color: var(--bg); box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.pill.on { opacity: 1; }
.pill.peek { pointer-events: auto; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; max-width: calc(100% - 140px); }
.pill.peek > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill.peek kbd { font: 11px var(--mono); border: 1px solid color-mix(in srgb, var(--bg) 45%, transparent); border-radius: 4px; padding: 0 4px; flex-shrink: 0; }
.toast {
  position: absolute; top: 16px; left: 50%; transform: translate(-50%, -8px); z-index: 13;
  max-width: min(560px, calc(100% - 32px));
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 14px; border-radius: 12px; font-size: 13px;
  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
}
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast .ico { width: 18px; height: 18px; flex-shrink: 0; margin-top: 1px; }

/* tooltip */
.tip {
  position: absolute; z-index: 20; pointer-events: none;
  min-width: 220px; max-width: 300px;
  padding: 11px 13px; border-radius: 12px;
  opacity: 0; transition: opacity .12s;
}
.tip.on { opacity: 1; }
.tip .t-title { font-weight: 600; font-size: 13.5px; margin: 2px 0 1px; }
.tip .t-sub { font-size: 12px; color: var(--text-2); margin-bottom: 8px; }
.tip .t-row { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; padding: 2px 0; }
.tip .t-row span:first-child { color: var(--text-2); }
.tip .t-hint { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 11.5px; color: var(--text-3); }
.tip .kicker { text-transform: none; letter-spacing: 0.01em; }
.tip .t-delta-up { color: var(--pos-text); }
.tip .t-delta-down { color: var(--neg-text); }

/* loading bar (tooltip + lists) */
.lbar { position: relative; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: visible; margin: 6px 0 2px; }
.lbar .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
.lbar .was { position: absolute; top: -2px; bottom: -2px; width: 2px; border-radius: 1px; background: var(--text-3); }
.lbar .lim { position: absolute; top: -3px; bottom: -3px; width: 1px; background: var(--text-2); opacity: .55; }

/* ---------- panel ---------- */
.panel {
  position: absolute; z-index: 15;
  top: 16px; right: 16px; bottom: 16px;
  width: 360px;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel-scroll { overflow-y: auto; overscroll-behavior: contain; flex: 1; }
.panel-scroll::-webkit-scrollbar { width: 8px; }
.panel-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; border: 2px solid transparent; background-clip: padding-box; }
.sec { padding: 16px 18px; border-bottom: 1px solid var(--border); }
.sec:last-child { border-bottom: 0; }
.sec h2 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.015em; }
.sec h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.net-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.about-btn { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; min-height: 26px; padding: 3px 6px 3px 8px; margin-right: -6px; border: 0; border-radius: 7px; background: transparent; color: var(--text-2); font-size: 12px; cursor: pointer; }
.about-btn:hover { background: var(--surface-2); color: var(--text); }
.about-btn svg { transition: transform .15s; }
.about-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.sec h3 .count { font-weight: 500; color: var(--text-3); }
.sec p { margin: 0; color: var(--text-2); }
.desc { color: var(--text-2); margin-top: 3px; font-size: 12.5px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 12px; color: var(--text-2); }
.facts b { color: var(--text); font-weight: 600; }
.solver-line { display: flex; align-items: center; gap: 8px; margin-top: 10px; padding: 6px 8px; margin-left: -8px; margin-right: -8px; width: calc(100% + 16px); font-size: 12px; color: var(--text-2); background: transparent; border: 0; border-radius: 8px; cursor: pointer; text-align: left; }
.solver-line:hover { background: var(--surface-2); }
.solver-line .sl-text { flex: 1; }
.solver-line .chev { color: var(--text-3); transition: transform .15s; flex-shrink: 0; }
.solver-line[aria-expanded="true"] .chev { transform: rotate(180deg); }
.solver-detail { margin-top: 6px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; }
.solver-detail .t-row { display: flex; justify-content: space-between; gap: 12px; padding: 2px 0; }
.solver-detail .t-row span { color: var(--text-2); }
.solver-detail .steps-h { margin-top: 8px; color: var(--text-2); }
.solver-detail .steps { display: flex; flex-wrap: wrap; gap: 2px 6px; margin-top: 4px; font-size: 11.5px; }
.solver-detail .steps .arr { color: var(--text-3); }

.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); color: var(--text-2); }
.num-in { width: 64px; height: 28px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface-solid); color: var(--text); font: 500 12.5px var(--font); text-align: right; flex-shrink: 0; }
.num-in:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.link-btn { padding: 0; border: 0; background: none; color: var(--accent-text); font: inherit; text-decoration: underline; cursor: pointer; }
.mobile-row { display: none; align-items: center; justify-content: space-between; margin-top: 12px; }
.view-select { display: none; }
.dot-ok { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex-shrink: 0; }
.dot-bad { width: 7px; height: 7px; border-radius: 50%; background: var(--crit); flex-shrink: 0; }

.search { position: relative; margin-top: 14px; }
.search input {
  width: 100%; height: 34px; padding: 0 10px 0 32px;
  border-radius: 9px; border: 1px solid var(--border-strong);
  background: var(--surface-2); color: var(--text);
  font: 13px var(--font);
}
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.search svg { position: absolute; left: 10px; top: 9px; width: 15px; height: 15px; color: var(--text-3); }
.search-results { margin-top: 6px; display: grid; gap: 2px; }

.empty { display: grid; gap: 12px; }
.empty h3 { margin: 0; }
.how { display: grid; gap: 9px; margin: 2px 0 0; padding: 0; list-style: none; }
.how li { display: flex; gap: 10px; color: var(--text-2); font-size: 12.5px; }
.how .n { width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center; font-size: 11px; font-weight: 600; background: var(--accent-soft); color: var(--accent-text); }
.try { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.try .kicker { margin-right: 4px; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 8px 5px 10px; border-radius: 8px;
  border: 1px solid var(--border-strong); background: var(--surface-2);
  font-size: 12px; font-weight: 500; cursor: pointer; color: var(--text);
}
.chip:hover { border-color: var(--accent); }
.chip.out { border-color: color-mix(in srgb, var(--removed) 45%, transparent); background: color-mix(in srgb, var(--removed) 9%, transparent); }
.chip .x { width: 16px; height: 16px; border-radius: 4px; display: grid; place-items: center; color: var(--text-3); }
.chip:hover .x { color: var(--removed); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.actions.two { display: grid; grid-template-columns: 1fr 1fr; }
.actions.two .wide { grid-column: 1 / -1; }
.link-btn { all: unset; color: var(--accent-text); cursor: pointer; font-weight: 500; }
.link-btn:hover { text-decoration: underline; }
.link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn:disabled:hover { border-color: var(--border-strong); }
.btn {
  height: 32px; padding: 0 12px; border-radius: 9px; min-width: 0;
  border: 1px solid var(--border-strong); background: var(--surface-2);
  font-size: 12.5px; font-weight: 500; cursor: pointer; color: var(--text);
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  white-space: nowrap;
}
.btn > span { overflow: hidden; text-overflow: ellipsis; }
.btn svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--text-2); }
.btn:hover { border-color: var(--accent); }
.btn:active { transform: translateY(0.5px); }
.btn.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.btn.primary svg { color: #fff; }
.btn.primary:hover { filter: brightness(1.08); }
.btn kbd { font: 11px var(--mono); color: var(--text-3); border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 4px; }
.btn.primary kbd { color: rgba(255,255,255,.8); border-color: rgba(255,255,255,.4); }

.sec .headline { font-size: 14px; line-height: 1.5; color: var(--text); margin: 0 0 14px; }
.headline b { font-weight: 600; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kpi { padding: 10px 12px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--border); min-width: 0; container-type: inline-size; }
.kpi .k-label { font-size: 11.5px; color: var(--text-2); display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 18px; white-space: nowrap; }
.kpi .k-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.kpi .k-val { font-size: 20px; font-weight: 600; margin-top: 2px; letter-spacing: -0.02em; white-space: nowrap; }
.kpi.crit .k-val { color: var(--crit-text); }
.kpi.warn .k-val { color: var(--warn-text); }
.kpi .k-unit { font-size: 12px; font-weight: 500; color: var(--text-3); margin-left: 2px; }
.kpi .k-was { font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.status { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; font-size: 11px; font-weight: 600; padding: 1px 6px 1px 4px; border-radius: 999px; }
.status svg { width: 11px; height: 11px; }
.status.crit { color: var(--crit-text); background: color-mix(in srgb, var(--crit) 13%, transparent); }
.status.warn { color: var(--warn-text); background: color-mix(in srgb, var(--warn) 16%, transparent); }
@container (max-width: 150px) { .kpi .status .st-text { display: none; } .kpi .status { padding: 2px 4px; } }

.list { display: grid; gap: 2px; margin-top: 4px; }
.cascade { margin: 14px 0 2px; padding: 12px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--crit) 35%, var(--border)); background: color-mix(in srgb, var(--crit) 6%, transparent); }
.cascade p { margin: 0; color: var(--text-2); font-size: 12.5px; }
.cascade p b { color: var(--text); }
.cascade .actions { margin-top: 10px; }
.csteps { display: grid; gap: 4px; margin: 8px 0 6px; }
.cstep { display: grid; grid-template-columns: 20px minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12.5px; }
.cstep .cnum { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; background: var(--badge); }
.cstep .cval { color: var(--text-2); white-space: nowrap; }
.cstate { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12.5px; color: var(--text); }
.cstate .spin { width: 14px; height: 14px; border-width: 2px; }
.fine { margin-top: 8px; font-size: 11.5px; color: var(--text-3); }
.item {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; align-items: center;
  padding: 8px 10px; margin: 0 -10px; border-radius: 9px; cursor: pointer;
}
.item:hover, .item.hl { background: var(--accent-soft); }
.item .i-name { font-size: 12.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .i-sub { font-size: 11.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .i-val { font-size: 12.5px; font-weight: 600; text-align: right; white-space: nowrap; }
.item .i-val.up { color: var(--pos-text); }
.item .i-val.down { color: var(--neg-text); }
.item .i-km { font-size: 11.5px; font-weight: 500; color: var(--text-3); }
.item .lbar { grid-column: 1 / -1; margin: 5px 0 1px; }
.sub-h { margin: 16px 0 4px; font-size: 12px; font-weight: 600; color: var(--text-2); }
.muted { color: var(--text-3); font-size: 12px; }
.progress { height: 4px; border-radius: 2px; background: var(--surface-2); overflow: hidden; margin: 10px 0 4px; }
.progress > div { height: 100%; background: var(--accent); width: 0; transition: width .15s; }
.foot { padding: 10px 18px; font-size: 11.5px; color: var(--text-3); border-top: 1px solid var(--border); display: flex; justify-content: space-between; gap: 6px 8px; flex-wrap: wrap; }
.foot span { white-space: nowrap; }
.foot kbd { font: 11px var(--mono); border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 4px; color: var(--text-2); }
.sheet-handle { display: none; }

/* new loads and plants */
.h-with-info { display: inline-flex; align-items: center; gap: 5px; }
.h-right { display: inline-flex; align-items: center; gap: 4px; }
.info { display: inline-grid; place-items: center; width: 16px; height: 16px; color: var(--text-3); cursor: help; flex-shrink: 0; }
.info svg { width: 14px; height: 14px; }
.info:hover, .info:focus-visible { color: var(--accent-text); outline: none; }
.palette { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tile { display: flex; align-items: center; gap: 8px; min-width: 0; height: 40px; padding: 0 8px 0 10px; border-radius: 10px; border: 1px dashed var(--border-strong); background: var(--surface-2); color: var(--text); font: 500 12.5px var(--font); cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
.tile > span { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile svg { width: 16px; height: 16px; flex-shrink: 0; color: var(--accent-text); }
.tile .grip { width: 14px; height: 14px; color: var(--text-3); }
.tile:hover { border-color: var(--accent); border-style: solid; }
.tile:active { cursor: grabbing; }
.tile[aria-pressed="true"] { border-style: solid; border-color: var(--accent); background: var(--accent-soft); }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.add-hint { margin-top: 8px; }
.add-hint[hidden] { display: none; }
.conn-list { display: grid; gap: 4px; margin-top: 10px; }
.conn-list:empty { display: none; }
.conn { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-radius: 10px; border: 1px solid transparent; }
.conn.on { border-color: var(--border-strong); background: var(--surface-2); }
.conn-row { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 7px 4px 7px 8px; border: 0; background: none; color: var(--text); font: inherit; text-align: left; cursor: pointer; border-radius: 10px; }
.conn:not(.on) .conn-row:hover { background: var(--accent-soft); }
.conn-ico { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--accent-strong); color: #fff; flex-shrink: 0; }
.conn-ico svg { width: 13px; height: 13px; }
.conn-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
.conn-name b { font-weight: 600; }
.conn-p { font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.conn-x { margin-right: 2px; }
.conn-ctl { grid-column: 1 / -1; padding: 2px 10px 10px; display: grid; gap: 8px; }
.size-ctl { display: flex; align-items: center; gap: 8px; min-width: 0; }
.size-ctl input[type=range] { flex: 1; min-width: 0; margin: 0; accent-color: var(--accent-strong); }
.num-wrap { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; }
.num-wrap .unit { font-size: 12px; color: var(--text-3); }
.conn-ctl .num-in { width: 72px; }
.pf-row, .src-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 12.5px; color: var(--text-2); }
.pf-row label, .src-row label { display: inline-flex; align-items: center; gap: 5px; }
.src-row { margin-top: 10px; }
.src-row[hidden] { display: none; }
.src-row .sel { width: auto; min-width: 150px; }
.sel { height: 28px; min-width: 0; padding: 0 6px; border-radius: 7px; border: 1px solid var(--border-strong); background: var(--surface-solid); color: var(--text); font: 500 12.5px var(--font); }
.sel:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#addRes { margin-top: 14px; }
#addRes:empty { display: none; }
#addRes .actions { margin-top: 12px; }
.facts-list { display: grid; gap: 6px; margin-top: 12px; }
.fact { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; color: var(--text-2); }
.fact b { color: var(--text); font-weight: 600; }
.fact .f-ico { width: 16px; height: 16px; flex-shrink: 0; color: var(--text-3); margin-top: 1px; }
.fact .f-ico svg { width: 16px; height: 16px; }
.fact.warn .f-ico { color: var(--warn-text); }
.fact.bad { color: var(--text); }
.fact.bad .f-ico { color: var(--crit-text); }

.legend .bins { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; height: 10px; margin-top: 4px; }
.legend .bins span { border-radius: 2px; }
.legend .bins span:first-child { border-radius: 5px 2px 2px 5px; }
.legend .bins span:last-child { border-radius: 2px 5px 5px 2px; }
.legend .bin-labels { display: grid; grid-template-columns: repeat(6, 1fr); font-size: 11px; color: var(--text-3); margin-top: 3px; }
.legend .bin-labels span { transform: translateX(-50%); white-space: nowrap; text-align: center; }
.legend .bin-labels span:first-child { transform: none; }
.checked { display: inline-flex; align-items: center; gap: 4px; }
.checked svg { width: 13px; height: 13px; color: var(--good); }
.seg.sm { padding: 2px; border-radius: 8px; }
.seg.sm button { padding: 3px 9px; font-size: 12px; border-radius: 6px; }
/* the checks: one row each, the open one unfolds its details */
.study { margin-top: 14px; }
.verdict { display: flex; align-items: center; gap: 9px; padding: 9px 12px; min-height: 42px; border-radius: 11px; font-size: 13px; background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2); }
.verdict > svg { width: 17px; height: 17px; flex-shrink: 0; }
.verdict > span:not(.spin) { flex: 1; min-width: 0; }
.verdict b { font-weight: 650; }
.verdict small { display: block; margin-top: 2px; font-size: 12px; color: var(--text-2); }
.verdict .btn { flex-shrink: 0; min-height: 30px; }
.verdict.ok { color: var(--good-text); background: color-mix(in srgb, var(--good) 9%, transparent); border-color: color-mix(in srgb, var(--good) 30%, transparent); }
.verdict.bad { color: var(--crit-text); background: color-mix(in srgb, var(--crit) 8%, transparent); border-color: color-mix(in srgb, var(--crit) 26%, transparent); }
.verdict.warn { color: var(--warn-text); background: color-mix(in srgb, var(--warn) 10%, transparent); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.verdict .spin, .check .spin { width: 14px; height: 14px; border-width: 2px; }
.checks { margin-top: 8px; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface-solid); }
.check + .check { border-top: 1px solid var(--border); }
.ck-row { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto 14px; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 8px 12px; cursor: pointer; font-size: 13px; }
@media (hover: hover) { .ck-row:hover { background: var(--accent-soft); } }
.ck-row:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.ck-ico { width: 18px; height: 18px; display: grid; place-items: center; color: var(--text-3); }
.ck-ico svg { width: 17px; height: 17px; }
.check.ok .ck-ico { color: var(--good); }
.check.bad .ck-ico { color: var(--crit); }
.check.warn .ck-ico { color: var(--warn); }
.ck-name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ck-val { color: var(--text-2); font-size: 12.5px; white-space: nowrap; }
.check.bad .ck-val { color: var(--crit-text); }
.check.ok .ck-val { color: var(--good-text); }
.ck-val.busy::after { content: '…'; }
.ck-chev { display: grid; color: var(--text-3); transition: transform .15s; }
.check.open .ck-chev { transform: rotate(180deg); }
.check.open .ck-row { background: color-mix(in srgb, var(--surface-2) 70%, transparent); }
.ck-body { padding: 10px 12px 12px; border-top: 1px solid var(--border); }
.ck-body > .kpis:first-child, .ck-body > .compare:first-child, .ck-body > .sub-h:first-child { margin-top: 0; }
.ck-note { margin-top: 8px; font-size: 12px; }
.ck-prog .progress { margin-top: 6px; }
.dot-st { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; background: var(--text-3); }
.dot-st.ok { background: var(--good); }
.dot-st.bad { background: var(--crit); }
.dot-st.warn { background: var(--warn); }
.more { margin-top: 12px; }
.more summary { cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-2); padding: 4px 0; }
.more summary:hover { color: var(--text); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.drag-ghost { position: fixed; left: 0; top: 0; z-index: 60; display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; background: var(--surface-solid); border: 1px solid var(--border-strong); box-shadow: var(--shadow); font: 600 12px var(--font); color: var(--text-2); pointer-events: none; opacity: 0; white-space: nowrap; }
.drag-ghost.on { opacity: 1; }
.drag-ghost.over { background: var(--accent-strong); border-color: var(--accent-strong); color: #fff; }
.drag-ghost .gh-ico svg { width: 15px; height: 15px; display: block; }
body.dragging-new, body.dragging-new * { cursor: grabbing !important; }
#map.placing { cursor: crosshair; }
#map.over-site { cursor: grab; }
.pickbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 8px 6px 10px 10px; margin-top: 10px; border-radius: 10px; background: var(--accent-soft); font-size: 12.5px; }
.pick-name { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pick-btns { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding-right: 4px; }
.pickbar .about-btn { margin-right: 0; }
.limit { margin: 14px 0 0; padding: 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); }
.limit .lim-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; font-size: 13px; }
.limit .lim-head .muted { margin-top: 2px; font-weight: 400; }
.limit .actions { margin-top: 10px; }
.lim-rows { display: grid; gap: 1px; margin-top: 8px; }
.lim-rows .t-row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; font-size: 12px; color: var(--text-2); padding: 2px 0; }
.lim-rows .t-row b { color: var(--text); white-space: nowrap; font-weight: 600; }
.lim-rows .t-row .i-sub { display: block; color: var(--text-3); font-weight: 400; }
.lim-rows .t-row.first > span { color: var(--text); font-weight: 600; }
.lim-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12.5px; color: var(--text-2); }
.lim-foot b { color: var(--text); }
.chart-wrap { position: relative; margin-top: 10px; }
.chart-wrap svg { display: block; width: 100%; height: auto; overflow: visible; cursor: crosshair; touch-action: pan-y; }
.ch-title { font: 600 11px var(--font); fill: var(--text-2); paint-order: stroke; stroke: var(--surface-solid); stroke-width: 4px; stroke-linejoin: round; }
.ch-tick, .ch-reflab { font: 10.5px var(--font); fill: var(--text-3); font-variant-numeric: tabular-nums; }
.ch-grid { stroke: var(--border); stroke-width: 1; }
.ch-ref { stroke: var(--text-3); stroke-width: 1; stroke-dasharray: 3 3; }
.ch-line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.ch-mark { stroke: var(--crit); stroke-width: 1; stroke-dasharray: 2 3; }
.ch-marklab { font: 600 10px var(--font); fill: var(--crit-text); }
.ch-now { stroke: var(--text); stroke-width: 1.5; }
.ch-hover { stroke: var(--text-3); stroke-width: 1; }
.ch-tip { position: absolute; top: 2px; transform: translate(-50%, -100%); padding: 3px 8px; border-radius: 7px; background: var(--surface-solid); border: 1px solid var(--border-strong); box-shadow: var(--shadow); font-size: 11.5px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .1s; }
.ch-tip.on { opacity: 1; }
.ch-axis { margin-top: 2px; text-align: center; font-size: 11px; }
.compare { margin: 8px 0 4px; }
.compare .sub-h, .ck-body .sub-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.compare .kpis { margin-top: 4px; }
.compare .sub-h .muted, .ck-body .sub-h .muted { font-weight: 400; font-size: 11.5px; }
.compare .i-val { color: var(--text); font-weight: 600; }
.compare .i-val .up { color: var(--pos-text); }

}

}

}

@media (max-width: 760px) {
  .top { gap: 8px; padding: 0 12px; height: 52px; }

  #engineTabs { display: none; }

function drawLabels(zk) {

  const show = (i) => {
    if (small) return true;

const MAPLIBRE = 'https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.24.0/maplibre-gl.min';

async function fetchStyle() {

    else if (id === 'water') p['fill-color'] = v('--map-water');

/** Solve the grid as it now is. A big grid takes a moment: say so first, then solve. */

  const key = S.key;
  busy(`Solving the ${S.engine === 'ac' ? 'AC' : 'DC'} power flow of ${M.n.toLocaleString('en-US')} buses`);

  S.solSeq++;
  S.solStats = S.sol.ok ? stats(S.sol) : null;
  if (changing() && !S.viewChosen && S.view === 'flow') setView('change', false, true);
  if (!changing() && !S.viewChosen && S.view === 'change') setView('flow', false, true);
  if (waveFrom != null) {
    const [ed, bd] = waveDelays(waveFrom);

    const e = waveFrom;
    if (typeof e === 'number') ripple = { x: (M.x[M.ef[e]] + M.x[M.et[e]]) / 2, y: (M.y[M.ef[e]] + M.y[M.et[e]]) / 2, t0: performance.now(), color: S.out.has(e) ? C.removed : C.accent };

    : `No ${S.engine === 'ac' ? 'AC' : 'DC'} power-flow answer with ${newName()} in (${S.sol.msg}).`, true);
  renderPanel();
  renderLegend();

  if (S.hover) showTip(S.hover, parseFloat($('tip').style.left) - 16, parseFloat($('tip').style.top) - 16);
}
/** A cascade's trips become ordinary removals once the user edits the grid by hand. */

/* ----- dragging a data center or plant onto a bus, or a placed one to another bus ----- */
const DRAG = { on: false, armed: false, kind: 'load', uid: null, bus: -1, id: null, x0: 0, y0: 0, touch: false, click: null };
/** The bus under a point of the page, if the point is over the map and near enough to one. */

  const R = DRAG.touch ? 34 : 24, near = nearby(px, py, R + 20);

/* ----- cascade: every line over its rating trips, the grid is solved again, until nothing more trips ----- */

/* ----- if a connection drops off at once ----- */
/** Each connection dropped off on its own, solved once, and compared with the grid just before (all of them in). */

/** Lines it leaves over their rating (that were not, or are WORSE_PTS further over), and the voltages that move most. */

  if (!sol.ok) return r;

/* ----- grid strength: the fault level at each new connection, against its size ----- */
/**
 * Fault level (MVA) at each of `buses`: the grid seen from the bus at the moment of a three-phase fault, every line in,
 * each synchronous machine behind its subtransient reactance X''d, loads and converter-fed plants left out, 1.0 pu
 * before the fault. The bus's diagonal entry of Z = Y^-1, from one solve per bus with Y factored once. Y is split into
 * real and imaginary parts, two rows per bus ordered so that every pivot is a susceptance (no pivoting needed).

    const r1 = [], r2 = [];
    for (let h = 0; h < g.length; h++) { r1.push(b[h], g[h]); r2.push(g[h], -b[h]); }

      if (t2.bad) { hi = mid; why = t2.why; } else { lo = mid; w = t2.sol; }
      await tick(); if (!live()) return false;
    }
  } else { lo = hi; why = kind === 'load' ? 'the plants run out of room' : 'the plants reach their minimum'; }
  res.exact.set(i, lo);
  res.exactWhy.set(i, why);
  return true;
}
async function verifyRoom(res) {
  const kind = res.kind, adds0 = res.adds;
  const check = (i) => roomCheck(res, i);
  // first the list: check its first unchecked bus until every bus on it is checked (a checked figure can fall below
  // an estimate further down, which then joins the list)
  for (let n = 0; n < 40; n++) {
    const next = roomTop(res).find((i) => !res.exact.has(i));
    if (next == null) break;
    if (!(await check(next))) return;
    renderRoom();
  }
  res.verified = true;
  renderRoom();
  if (S.view === 'room') restyle(1);
  // then, on a grid that solves quickly, every bus where a voltage is the limit (the estimate is rougher there)
  if (M.n <= 1000) {
    const t0 = performance.now();
    const rest = res.cand.filter((i) => res.why[i] < 0 && !res.exact.has(i) && !adds0.some((a) => a.bus === i && a.kind === kind));
    for (const [k, i] of rest.entries()) {
      if (performance.now() - t0 > 20000) break;
      if (!(await check(i))) return;
      if (k % 20 === 19) { renderRoom(); if (S.view === 'room') restyle(1); }
    }
  }
  renderRoom();
  if (S.view === 'room') restyle(150);
}
/** The room shown for bus i: the exact figure where it has been checked, the estimate otherwise. */
const roomAt = (r, i) => (r.exact.has(i) ? r.exact.get(i) : r.room[i]);
/** The Jacobian factored at solution sol (the case the solver sees now), with the bus types and voltages it ended at. */
function sensAt(sol) {
  const I = island(NONE), { nL, L } = I;
  const ty = new Uint8Array(nL);
  for (let k = 0; k < nL; k++) {
    const i = L[k];
    if (I.isSlack[k]) ty[k] = sol.qlim[i] && slackLimited(i) ? 3 : 2;
    else ty[k] = (M.typ[i] === 1 || (M.typ[i] === 2 && M.ng[i])) && !sol.qlim[i] ? 1 : 0;
  }
  const vm = Float64Array.from(L, (i) => sol.vm[i]), va = Float64Array.from(L, (i) => sol.va[i]);
  const P = new Float64Array(nL), Q = new Float64Array(nL);
  injections(I, vm, va, P, Q);
  const J = jacPattern(I, ty);
  if (!J.dim || !jacFactor(I, J, vm, va, P, Q)) return null;
  return { I, ty, vm, va, J };
}
const roomDone = (r) => !!r && !r.err && r.done >= r.cand.length;
/** What stops it at bus i, in words. */
function roomWhy(i) {
  const r = ROOM.res, w = r && r.why[i];
  if (!r || !isFinite(r.room[i])) return '';
  if (r.exactWhy.has(i)) return r.exactWhy.get(i);   // checked: what the exact check ran into
  if (w > 0) return `${edgeTitle(w - 1)} reaches its rating`;
  if (w < 0) return `bus ${M.ids[-w - 1]} falls below 0.95 pu`;
  return r.kind === 'load' ? 'the plants run out of room' : 'the plants reach their minimum';
}
function setRoomKind(k) {
  if (S.roomKind === k) return;
  S.roomKind = k;
  startRoom(); restyle(200); renderLegend(); renderRoom();
}
/** The panel while the map shows room: the buses with the most, and what each would run into. */
function renderRoom() {
  const el = $('secRoom');
  if (!el) return;
  if (S.view !== 'room') { el.hidden = true; return; }
  el.hidden = false;
  const r = ROOM.res, load = S.roomKind === 'load';
  const head = `<h3><span class="h-with-info">Room for a new ${load ? 'data center' : 'plant'}${info(`An estimate for picking a site: how many MW each bus could take before a line reaches its rating${load ? ' or a voltage falls below 0.95 pu' : ''}, every line in, ${S.adds.length ? 'with what you placed in, ' : ''}worked out from the grid's sensitivities at today's power flow. Place one to run the full checks, outages included.`)}</span>
      <span class="seg sm" role="group" aria-label="New load or plant"><button data-rk="load" aria-pressed="${load}">Load</button><button data-rk="plant" aria-pressed="${!load}">Plant</button></span></h3>`;
  let body = '';
  if (!r || r.err) body = `<p class="muted">${r && r.err === 'ac' ? 'The estimate uses the AC power flow: switch to AC.' : 'There is no power-flow answer to estimate from.'}</p>`;
  else {
    const top = roomTop(r);
    const fin = roomDone(r);
    body = `${fin ? '' : `<div class="progress" style="margin-bottom:8px"><div style="width:${Math.round((r.done / r.cand.length) * 100)}%"></div></div>`}
      <div class="sub-h" style="margin-top:0">Most room${roomMinKv() ? ` · ${roomMinKv()} kV and up` : ''}</div>
      <div class="list">${top.map((i) => `<div class="item" data-room-bus="${i}">
        <div><div class="i-name">Bus ${M.ids[i]} · ${esc(M.names[i])}</div><div class="i-sub">${fmtNum(M.kv[i], M.kv[i] % 1 ? 1 : 0)} kV · ${esc(roomWhy(i))}</div></div>
        <div class="i-val num">${r.exact.has(i) ? `<span class="checked" title="Checked with the full AC power flow">${ICON_OK}${fmtP(Math.floor(r.exact.get(i)))} MW</span>` : `≈ ${fmtP(Math.floor(r.room[i]))} MW`}</div></div>`).join('')}</div>
      <p class="muted ck-note">${fin && !r.verified ? 'Checking these with the full power flow… ' : ''}Click one to place it there.${fin ? ` Map: ${r.cand.length.toLocaleString('en-US')} buses estimated in ${r.ms < 1000 ? `${Math.max(1, Math.round(r.ms))} ms` : `${fmtNum(r.ms / 1000, 1)} s`}.` : ''}</p>`;
  }
  el.innerHTML = head + body;
  el.querySelectorAll('[data-rk]').forEach((b) => { b.onclick = () => setRoomKind(b.dataset.rk); });
  el.querySelectorAll('[data-room-bus]').forEach((it) => {
    const i = +it.dataset.roomBus;
    it.onmouseenter = () => { S.focus = { type: 'bus', i }; };
    it.onmouseleave = () => { S.focus = null; };
    it.onclick = () => { S.focus = { type: 'bus', i }; flyTo([M.x[i]], [M.y[i]]); pickBus(i); };
  });
}

/* =====================================================================
   Legend
   ===================================================================== */
const SW = {
  line: (c, w = 3) => `<svg viewBox="0 0 22 12"><path d="M1 6h20" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/></svg>`,
  dash: (c) => `<svg viewBox="0 0 22 12"><path d="M1 6h20" stroke="${c}" stroke-width="2" stroke-dasharray="4 3"/><circle cx="11" cy="6" r="5" fill="${c}"/><path d="M9 4l4 4M13 4l-4 4" stroke="#fff" stroke-width="1.4"/></svg>`,
  dots: (c) => `<svg viewBox="0 0 22 12"><path d="M1 6h20" stroke="${c}" stroke-width="3" stroke-linecap="round"/><circle cx="6" cy="6" r="1.6" fill="#fff"/><circle cx="14" cy="6" r="1.6" fill="#fff"/></svg>`,
  dot: (c, r = 4) => `<svg viewBox="0 0 22 12"><circle cx="11" cy="6" r="${r}" fill="${c}"/></svg>`,
  ring: (c) => `<svg viewBox="0 0 22 12"><circle cx="11" cy="6" r="3.2" fill="none" stroke="${c}" stroke-width="1.4"/></svg>`,
  slack: (c, g2) => `<svg viewBox="0 0 22 12"><circle cx="11" cy="6" r="3.4" fill="${g2}"/><circle cx="11" cy="6" r="5.6" fill="none" stroke="${c}" stroke-width="1.4"/></svg>`,
  dead: (c) => `<svg viewBox="0 0 22 12"><path d="M1 6h20" stroke="${c}" stroke-width="1.6" stroke-dasharray="2 3"/></svg>`,
  load: (b, c) => `<svg viewBox="0 0 22 12"><circle cx="11" cy="3.2" r="3" fill="${b}"/><path d="M11 7v2" stroke="${c}" stroke-width="1.4"/><path d="M8.6 8.6h4.8L11 12z" fill="${c}"/></svg>`,
  site: (c) => `<svg viewBox="0 0 22 12"><rect x="1" y="1.5" width="20" height="9" rx="4.5" fill="${c}"/></svg>`,
  trip: (c) => `<svg viewBox="0 0 22 12"><path d="M1 6h20" stroke="${c}" stroke-width="2" stroke-dasharray="2 3"/><circle cx="11" cy="6" r="5.5" fill="${c}"/><text x="11" y="8.6" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff" font-family="sans-serif">1</text></svg>`,
};
function renderLegend() {
  const el = $('legendContent');
  const view = S.showBefore ? 'flow' : S.view;
  const grad = (cols) => `linear-gradient(90deg, ${cols.join(', ')})`;
  let head = '', body = '';
  const fuelsHere = FUEL_ORDER.filter((f) => M.fuel.includes(f));
  const common = `
    <div class="row lg-sub">Generators by fuel (size = output)</div>
    <div class="fuel-grid">${fuelsHere.map((f) => `<div class="row"><span class="sw">${glyphSvg(FUELS[f].shape, C.fuelCss[f])}</span>${FUELS[f].label}</div>`).join('')}</div>
    <div class="row"><span class="sw">${SW.load(C.busCss, C.load)}</span>Load (dot size = demand; arrow when zoomed in)</div>
    <div class="row"><span class="sw">${SW.slack(getComputedStyle(document.documentElement).getPropertyValue('--slack'), C.fuelCss[M.fuel[M.slack] || 'other'])}</span>Slack bus: makes up any shortfall</div>
    ${S.adds.length ? `<div class="row"><span class="sw">${SW.site(C.accentStrong)}</span>${S.adds.length === 1 ? `New ${ADD_NAME[S.adds[0].kind]}, ${fmtP(S.adds[0].p)} MW` : 'New loads and plants'}</div>` : ''}
    <div class="row"><span class="sw">${SW.dash(C.removed)}</span>Removed by you</div>
    ${S.tripped.size ? `<div class="row"><span class="sw">${SW.trip(C.removed)}</span>Tripped in the cascade, by step</div>` : ''}
    <div class="row"><span class="sw">${SW.ring(C.removed)}</span>Cut off from the main grid</div>`;
  if (view === 'flow') {
    head = 'Power flow';
    if (M.rated) {
      body = `<div class="ramp" style="background:${grad(C.seqCss)}"></div>
        <div class="ramp-labels"><span>0%</span><span>loading of rating</span><span>80%</span></div>
        <div class="rows" style="border-top:0;margin-top:6px;padding-top:0">
          <div class="row"><span class="sw">${SW.line(C.warnCss)}</span>80–100%: close to the limit</div>
          <div class="row"><span class="sw">${SW.line(C.critCss, 4)}</span>Over 100%: overloaded</div>
        </div>`;
    } else {
      body = `<div class="ramp" style="background:${grad(C.seqCss)}"></div>
        <div class="ramp-labels"><span>small</span><span>power flow</span><span>large</span></div>
        <div class="note">This case file has no line ratings, so color shows flow, not loading.</div>`;
    }
    body += `<div class="rows"><div class="row"><span class="sw">${SW.dots(C.seqCss[1])}</span>Width = power; dots move with it</div>${common}</div>`;
  } else if (view === 'change') {
    head = S.peek ? (S.peek.kind === 'unit' ? 'Change with the unit out' : 'Change after the trip') : S.out.size || !S.adds.length ? 'Change since removal' : 'Change since connecting';
    body = `<div class="ramp" style="background:${grad(C.divCss)}"></div>
      <div class="ramp-labels"><span>less flow</span><span>no change</span><span>more flow</span></div>
      <div class="note">${changing() && S.sol.ok ? `Full color = ${fmtMW(ST.deltaRef)} MW; width = size of the change.` : 'Width = size of the change.'}${S.engine === 'ac' ? ' Buses and shading: red = voltage fell, blue = rose.' : ''}${changing() ? '' : '<br><b>Take a line out or connect something to see changes.</b>'}</div>
      <div class="rows">${common}</div>`;
  } else if (view === 'voltage') {
    head = 'Bus voltage';
    body = S.engine === 'ac' ? `<div class="ramp" style="background:${grad([C.busDivCss[2], C.busDivCss[1], C.busDivCss[0]])}"></div>
      <div class="ramp-labels"><span>0.95 pu</span><span>1.00</span><span>1.05 pu</span></div>
      <div class="note">Bigger dot = further from 1.00 pu. The shading under the grid spreads each bus's voltage over its surroundings, so low and high regions stand out; near 1.00 pu it fades out.</div><div class="rows">${common}</div>` : `<div class="note">The DC model has no voltage magnitudes (all 1.0 pu). Switch to AC.</div>`;
  } else if (view === 'risk') {
    head = 'N-1: effect of losing each line';
    const done = S.scan && S.scan.engine === S.engine && S.scan.done === M.m;
    body = `<div class="ramp" style="background:${grad(C.seqCss)}"></div>
      <div class="ramp-labels"><span>0</span><span>${M.rated ? 'loading jump elsewhere' : 'flow shift elsewhere'}</span><span>${done ? (M.rated ? '+' + fmtNum(ST.riskRef, 0) + ' pts' : fmtMW(ST.riskRef) + ' MW') : '…'}</span></div>
      <div class="note">Each line is colored by what happens to the rest of the grid when that line alone is lost. Width says the same.</div>
      <div class="rows">
        <div class="row"><span class="sw">${SW.line(C.deadCss, 2)}</span>Radial: its loss cuts off load</div>
        <div class="row"><span class="sw">${SW.line(C.critCss, 4)}</span>No power-flow answer without it</div>
      </div>`;
  }
  if (view === 'room') {
    const r = ROOM.res, load = S.roomKind === 'load';
    head = load ? 'Room for new load' : 'Room for a new plant';
    body = r && !r.err ? `<div class="bins">${C.roomCss.map((c) => `<span style="background:${c}"></span>`).join('')}</div>
      <div class="bin-labels"><span></span>${ROOM_BREAKS.map((b) => `<span>${b >= 1000 ? b / 1000 + ' GW' : b}</span>`).join('')}</div>
      <div class="ramp-labels" style="justify-content:center">MW it could take</div>
      <div class="note">An estimate, every line in: until a line reaches its rating${load ? ' or a voltage falls below 0.95 pu' : ''}. Place one to run the full checks.</div><div class="rows">${common}</div>`
      : `<div class="note">${r && r.err === 'ac' ? 'Switch to AC for this view.' : 'No power-flow answer to estimate from.'}</div>`;
  }
  el.innerHTML = `<h4><span class="lg-full">${head}</span><span class="lg-short">Legend</span></h4><div class="legend-body">${body}</div>`;
}

/** Grid menu labels: name and region, or the name alone where the header is narrow. */
function netLabels() {
  const short = window.innerWidth < 480;
  if (netLabels.short === short) return;
  netLabels.short = short;
  for (const o of $('netSelect').options) { const x = netInfo(o.value); o.textContent = x.name + (!short && x.region ? ' · ' + x.region : ''); }
}
function setLegendFolded(on) {
  $('legend').classList.toggle('collapsed', on);
  const t = $('legendToggle');
  t.setAttribute('aria-label', on ? 'Open the legend' : 'Fold the legend');
  t.title = on ? 'Open the legend' : 'Fold the legend';
  t.setAttribute('aria-expanded', String(!on));
  FOOT.key = '';
}

/* =====================================================================
   URL hash: #network or #network/out=1,2,3
   ===================================================================== */
function writeHash() {
  const trips = [...S.tripped.entries()].map(([e, k]) => `${e}.${k}`);
  const add = S.adds.map((a) => `/${a.kind}=${M.ids[a.bus]},${+a.p.toFixed(1)}${a.kind === 'load' ? ',' + a.pf : ''}`).join('') + (S.adds.length && S.src === 'slack' ? '/src=slack' : '');
  const h = '#' + S.key + add + (S.history.length ? '/out=' + S.history.join(',') : '') + (trips.length ? '/trip=' + trips.join(',') : '');
  try { if (location.hash !== h) history.replaceState(null, '', h); } catch (e) { /* file:// in some browsers */ }
}
function readHash() {
  const parts = (location.hash || '').replace('#', '').split('/');
  const key = (parts[0] || '').toLowerCase();
  if (!netInfo(key)) return null;
  const r = { key, out: [], trip: [], adds: [], src: 'spread' };
  for (const seg of parts.slice(1)) {
    const [k, v = ''] = seg.split('=');
    if (k === 'out') r.out = v.split(',').filter(Boolean).map(Number).filter(Number.isInteger);
    else if (k === 'trip') r.trip = v.split(',').map((t) => t.split('.').map(Number)).filter((t) => t.length === 2 && t.every(Number.isInteger));
    else if (k === 'load' || k === 'plant') {
      const f = v.split(','), id = Number(f[0]), p = Number(f[1]), pf = Number(f[2]);
      if (Number.isInteger(id) && p > 0) r.adds.push({ kind: k, id, p, pf: k === 'load' && pf > 0 ? pf : 0.98 });
      if (f.includes('slack')) r.src = 'slack';   // links from before several connections: the supply rode along
    } else if (k === 'src' && v === 'slack') r.src = 'slack';
  }
  return r;
}

/* =====================================================================
   Wiring
   ===================================================================== */
function init() {
  readTheme();
  $('netSelect').innerHTML = NETWORKS.map((x) => `<option value="${x.key}" title="${x.n.toLocaleString('en-US')} buses">${esc(x.name)}${x.region ? ' · ' + esc(x.region) : ''}</option>`).join('');
  netLabels();
  $('netSelect').onchange = (ev) => loadNetwork(ev.target.value);
  $('viewTabs').onclick = (ev) => { const b = ev.target.closest('button'); if (b) setView(b.dataset.view, true); };
  $('viewSelect').onchange = (ev) => setView(ev.target.value, true);
  document.querySelectorAll('.engine-seg').forEach((grp) => {
    grp.onclick = (ev) => { const b = ev.target.closest('button'); if (b) setEngine(b.dataset.engine); };
  });
  $('searchBox').addEventListener('input', onSearch);
  $('searchBox').addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') { const f = $('searchResults').querySelector('.item'); if (f) f.click(); }
    if (ev.key === 'Escape') { ev.target.value = ''; $('searchResults').innerHTML = ''; ev.target.blur(); }
    ev.stopPropagation();
  });
  $('themeBtn').onclick = () => setTheme(C.dark ? 'light' : 'dark');
  $('zoomIn').onclick = () => { const a = mapArea(); zoomAt(1.4, (a.x0 + a.x1) / 2, (a.y0 + a.y1) / 2); };
  $('zoomOut').onclick = () => { const a = mapArea(); zoomAt(1 / 1.4, (a.x0 + a.x1) / 2, (a.y0 + a.y1) / 2); };
  $('zoomFit').onclick = () => fitView(true);
  $('mapToggle').onclick = () => setBasemap(!BASEMAP.on);
  $('legendToggle').onclick = () => setLegendFolded(!$('legend').classList.contains('collapsed'));
  $('attribBtn').onclick = () => { const a = $('attrib'); a.classList.toggle('open'); $('attribBtn').setAttribute('aria-expanded', String(a.classList.contains('open'))); };
  $('sheetHandle').onclick = () => {
    $('panel').classList.toggle('min');
    if (!cam.touched) setTimeout(() => fitView(true), 260);   // the map gets the room the sheet gave up
  };
  // on resize: refit if the user has not moved the map, otherwise keep the same place in the middle
  let rzTimer = 0;
  window.addEventListener('resize', () => {
    const a0 = mapArea();
    const wx = ((a0.x0 + a0.x1) / 2 - cam.x) / cam.s, wy = ((a0.y0 + a0.y1) / 2 - cam.y) / cam.s;
    resize();
    if (!cam.touched) fitView(false);
    else { const a = mapArea(); cam.x = (a.x0 + a.x1) / 2 - wx * cam.s; cam.y = (a.y0 + a.y1) / 2 - wy * cam.s; }
    hideTip();
    netLabels();
    clearTimeout(rzTimer);
    rzTimer = setTimeout(() => { if (!cam.touched) fitView(false); }, 150);
  });
  const typing = (ev) => ev.target && (ev.target.tagName === 'INPUT' || ev.target.tagName === 'SELECT' || ev.target.tagName === 'TEXTAREA');
  window.addEventListener('keydown', (ev) => {
    if (typing(ev)) return;
    // with Ctrl, Cmd or Alt the key belongs to the browser (Cmd+F, Ctrl+1...), except Ctrl+Z / Cmd+Z, which undoes here
    if (ev.ctrlKey || ev.metaKey || ev.altKey) {
      if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && !ev.shiftKey && (ev.key === 'z' || ev.key === 'Z')) { undo(); ev.preventDefault(); }
      return;
    }
    if (ev.key === ' ') { if (!ev.repeat) showBefore(true); ev.preventDefault(); }
    else if (ev.key === 'Escape') {
      if (DRAG.armed) cancelDrag();
      else if (S.peek) endPeek();
      else if (S.placing) { S.placing = null; canvas.classList.remove('placing'); renderAdd(); }
      else restoreAll();
    }
    else if (ev.key === 'z' || ev.key === 'Z' || ev.key === 'Backspace') { undo(); ev.preventDefault(); }
    else if (ev.key === 'f' || ev.key === 'F') fitView(true);
    else if ((ev.key === 'm' || ev.key === 'M') && !$('mapToggle').disabled) setBasemap(!BASEMAP.on);
    else if (ev.key >= '1' && ev.key <= '5') setView(['flow', 'change', 'voltage', 'risk', 'room'][+ev.key - 1], true);
  });
  window.addEventListener('keyup', (ev) => {
    // nor is the Space passed on to a focused button when it comes up (some browsers click it then)
    if (ev.key === ' ') { showBefore(false); if (!typing(ev)) ev.preventDefault(); }
  });
  window.addEventListener('blur', () => showBefore(false));   // Space let go in another window: no keyup here
  // a link pasted into this tab: the page follows it
  window.addEventListener('hashchange', () => {
    const h = readHash();
    if (!h) return;
    if (h.key !== S.key) { loadNetwork(h.key, h.out, h.trip, h); return; }
    setOutages(h.out, h.trip);
    const adds = addsFromSpec(h);
    if (addsKey(adds, h.src) !== addsKey()) { setAdds(adds, { src: h.src }); return; }
    resolve(S.history[S.history.length - 1] ?? null);
  });
  if (window.matchMedia) {
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (!document.documentElement.hasAttribute('data-theme')) setTheme(null); });
  }
  const h = readHash();
  resize();
  // the legend starts folded where the map has little room
  { const a = mapArea(); if (window.innerWidth <= 760 || a.x1 - a.x0 < 760 || a.y1 - a.y0 < 640) setLegendFolded(true); }
  loadNetwork(h ? h.key : (netInfo('activsg500') ? 'activsg500' : NETWORKS[0].key), h ? h.out : null, h ? h.trip : null, h);
  requestAnimationFrame(loop);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { /* labels pick up the web font */ });
}
init();
</script>
